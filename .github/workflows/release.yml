name: release

# One tag, vX.Y.Z, releases everything at that version: the container image (signed, with an SBOM and build
# provenance), the Helm chart (as an OCI artifact), and the Go module (pkg/ is versioned by the tag itself).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write  # keyless signing (Sigstore), tied to this workflow

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v  # v0.1.0 → 0.1.0, the tag the Helm chart's appVersion names
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: The tag, the chart and the changelog agree
        run: |
          grep -q "^version: ${{ steps.v.outputs.version }}$" deploy/helm/fences-gateway/Chart.yaml
          grep -q "^appVersion: \"${{ steps.v.outputs.version }}\"$" deploy/helm/fences-gateway/Chart.yaml
          grep -q "^## ${{ steps.v.outputs.version }} " CHANGELOG.md
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true  # an SPDX SBOM attached to the image
          provenance: mode=max
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"
      - uses: azure/setup-helm@v4
      - name: Publish the chart
        run: |
          helm package deploy/helm/fences-gateway
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "fences-gateway-${{ steps.v.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
