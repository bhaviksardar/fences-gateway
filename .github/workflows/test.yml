name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]  # the reference engine is stdlib only; oldest and newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install jsonschema && python conformance/reference.py  # every case, and every policy against spec/rules/schema.json

  go:
    runs-on: ubuntu-latest
    services:
      redis:  # replicas' shared limits (internal/engine TestSharedLimits)
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      FENCES_TEST_REDIS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...  # conformance/: spec/conformance against pkg/policy

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/fences-gateway
      - run: helm template gw deploy/helm/fences-gateway --set replicas=3 --set sharedLimits.urlSecret.name=redis --set kubernetes.enabled=true > /dev/null
      - run: "! helm template gw deploy/helm/fences-gateway --set replicas=3 2>/dev/null"  # refused without shared limits
