# A StatefulSet so the gateway's identity (enrolled once), last good bundle and event queue survive restarts
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: fences-gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}
  selector:
    matchLabels: {app.kubernetes.io/name: fences-gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fences-gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/fences-gateway/config.json"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            {{- if .Values.enrollToken.secretName }}
            - name: FENCES_ENROLL_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.enrollToken.secretName }}, key: {{ .Values.enrollToken.key }}, optional: true}
            {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            - secretRef: {name: {{ .Values.envFromSecret }}}
          {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:  # not ready until a verified bundle is loaded
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/fences-gateway, readOnly: true}
            - {name: data, mountPath: /var/lib/fences-gateway}
            - {name: tmp, mountPath: /tmp}  # the root filesystem is read-only; SQLite may want temp files
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.storage.size }}}
