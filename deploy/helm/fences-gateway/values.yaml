image:
  repository: ghcr.io/bhaviksardar/fences-gateway
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Becomes config.json (see cmd/fences-gateway). data_dir and listen are set by the chart.
config:
  platform: https://fences.example.com
  name: ""  # defaults to the release name
  upstreams: {}
  #  crm:
  #    url: http://crm-mcp.tools.svc:8000/mcp
  #    headers:
  #      Authorization: "Bearer ${CRM_TOKEN}"  # from envFromSecret
  apis: {}  # HTTP APIs, served at /http/<name>/
  #  refunds:
  #    url: http://refunds.payments.svc:8080/api
  #    headers:
  #      X-Api-Key: "${REFUNDS_KEY}"
  report_argument_values: false
  # pinned_signing_keys: {k1: "<base64>"}

# The one-time enrollment token, used on first start only. The identity it produces is kept on the volume.
enrollToken:
  secretName: ""
  key: token

# A Secret whose keys become environment variables, for ${NAME} in upstream headers.
envFromSecret: ""

# Replicas: each pod enrolls as its own gateway in one group, so make the enrollment token for this many gateways.
# More than one needs sharedLimits, so the group counts limits together (docs/replicas.md).
replicas: 1
sharedLimits:
  urlSecret:  # a Secret holding redis://[user:password@]host:port[/db] (or rediss://)
    name: ""
    key: url
  prefix: ""  # default fences:limits:
storage:
  size: 1Gi
  storageClassName: ""

service:
  port: 8080

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {memory: 256Mi}

# Kubernetes: an admission webhook for AI agents' service accounts, and containment on quarantine. The gateway then
# serves https (the API server calls webhooks over TLS only). See docs/kubernetes.md.
kubernetes:
  enabled: false
  agents: []  # their service accounts, e.g. system:serviceaccount:ops:sre-bot (set the same on the agent in Fences)
  writeRoles: []  # the Roles and ClusterRoles the agents' write bindings refer to: the gateway may bind only these
  failurePolicy: Fail  # the gateway unreachable: the agents' writes are refused
  auditToken:  # the audit webhook's Bearer token, from a Secret; unset: no /k8s/audit
    secretName: ""
    key: token

